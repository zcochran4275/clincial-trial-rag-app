# Copy to ~/.dbt/profiles.yml
trial_signal:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: workspace
      schema: trial_signal
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 2
